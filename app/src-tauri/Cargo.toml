[package]
name = "myco"
version = "0.3.1"
description = "myco — desktop wiki for plain markdown vaults"
authors = ["myco contributors"]
edition = "2021"
# 1.77.2 is what tauri 2.11.1 and tauri-plugin-updater 2.10.1 both declare; the
# old "1.77" here was below our own dependencies' floor.
rust-version = "1.77.2"

[lib]
name = "myco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: macOS menu bar tray; image-png: decode the tray glyph PNG at
# compile time (Image::from_bytes); macos-private-api: transparent webview
# for the frameless tray popover window (WebviewWindowBuilder::transparent).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
# In-app updates (Settings → About). rustls-tls only: the default feature set
# pulls native-tls, and reqwest above is already rustls-only — two TLS stacks in
# one binary is pure size for no gain.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gray_matter = "0.3"
tempfile = "3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
calamine = "0.36.1"
pdf-extract = "0.10.0"
# Embedded local model (bundled SEED 0.5B GGUF). Pure in-process inference — no
# daemon, no Python. Metal is on by default on macOS. Vendors + compiles
# llama.cpp at build time (adds ~5 min to a clean release build).
llama-cpp-2 = "0.1.150"
# Raw llama.cpp bindings, used ONLY by `src/rerank.rs` (behind the `rerank`
# feature, off by default). It is already in the lockfile as llama-cpp-2's own
# dependency, so naming it here as `optional` adds no new code to the build —
# it only makes the already-compiled sys crate callable when `rerank` is
# enabled, without adding a direct-dependency edge to a default build. The `=`
# pin must track llama-cpp-2's exact version: a skew would build and link a
# SECOND copy of llama.cpp, and `=` turns that into a resolution error instead
# of a silent disaster. Bump both lines together, never one alone.
llama-cpp-sys-2 = { version = "=0.1.150", optional = true }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
# Recoverable deletes: delete_path moves entries to the OS trash instead of
# unlinking them, so a mis-click never permanently destroys notes.
trash = "5.2.3"
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
axum = "0.8"
tokio-util = "0.7"
similar = "2"
notify = "8.2.0"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
serial_test = "3"
criterion = "0.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Cross-encoder reranker (src/rerank.rs) — a retired, measurement-only
# experiment (see eval/BASELINE.md). Off by default so a normal build compiles
# none of it and does not pull llama-cpp-sys-2 in as a direct dependency.
rerank = ["dep:llama-cpp-sys-2"]

[[bench]]
name = "vector_store"
harness = false

# Benches run on a release-derived profile. The shipped release profile is tuned
# for binary size (opt-level = "s", fat LTO), which both distorts CPU numbers and
# makes every bench build a full relink. Bench with a normal optimizing profile
# instead: the absolute numbers then read slightly faster than the shipped build,
# but the A/B deltas these benches exist to measure stay honest.
[profile.bench]
opt-level = 3
lto = false
codegen-units = 16
strip = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
