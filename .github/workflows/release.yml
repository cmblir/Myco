name: release

# Two jobs, one per trigger, because macOS and Windows reach a release by
# genuinely different routes:
#
# - `push: tags` -> `macos-updater`. Builds the macOS .app + .dmg and, when the
#   updater key secret exists, the updater artifacts (.app.tar.gz + .sig) and
#   latest.json — the channel tauri-plugin-updater polls. It always opens a
#   DRAFT release: signing and the updater key are both opt-in via secrets, so
#   what the runner produced has to be checked (scripts/verify-macos-release.sh)
#   before anyone is offered it. Until the draft is published,
#   `releases/latest/download/latest.json` does not resolve, so no user is ever
#   offered an update whose installer nobody verified.
#
#   Every secret in this file is optional. With none set the job still goes
#   green: it builds an unsigned .dmg and no updater artifacts. That is what a
#   fork or a contributor gets.
# - `workflow_dispatch` -> `publish-tauri`. The NSIS .exe, added to an existing
#   release on demand. Manual since v0.3.0 and unchanged here.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and attach assets to (e.g. v0.3.0)"
        required: true

jobs:
  # macOS + the updater channel. Everything the updater consumes is produced
  # here: only this job has the signing key, so only artifacts built here carry a
  # signature the shipped app will accept.
  macos-updater:
    if: github.event_name == 'push'
    permissions:
      contents: write # tauri-action creates the draft release + uploads assets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Same reason as the Windows job: the bundled SEED model lives in Git
          # LFS and a pointer file would ship as the "offline model".
          lfs: true

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri

      - name: install frontend dependencies
        run: npm ci
        working-directory: app

      # Turn signing / notarization / updater signing on ONLY for the secrets
      # that actually exist, by exporting them through $GITHUB_ENV.
      #
      # Why not a plain `env:` block on the build step: an expression that
      # resolves to a missing secret still DEFINES the variable, as an empty
      # string, and every consumer here tests presence, not emptiness.
      #   - tauri-bundler macos/sign.rs: `var_os("APPLE_CERTIFICATE")` ->
      #     Some("") means "import this certificate", and `security import` of
      #     zero bytes fails the whole bundle.
      #   - notarize_auth(): APPLE_ID + APPLE_PASSWORD present but APPLE_TEAM_ID
      #     absent is a HARD error (NotarizeAuthError::MissingTeamId), so the
      #     notarization trio is all-or-nothing.
      #   - tauri-cli bundle.rs: an empty TAURI_SIGNING_PRIVATE_KEY is still
      #     `Ok("")` and dies later in "failed to decode secret key".
      # Exporting only the non-empty ones leaves the rest genuinely UNSET, which
      # is the state tauri reads as "don't sign".
      - name: configure signing from secrets (skips what is not set)
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Heredoc form so a value with spaces, quotes or newlines cannot
          # inject extra variables into the environment file.
          export_secret() {
            printf '%s<<MYCO_SECRET_EOF\n%s\nMYCO_SECRET_EOF\n' "$1" "$2" >> "$GITHUB_ENV"
          }

          signed=false
          notarized=false
          updater=false

          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            export_secret APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            export_secret APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            # Optional: the imported certificate already carries its identity.
            # When set, the bundler checks the two agree and fails if they don't.
            if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
              export_secret APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            fi
            signed=true
          fi

          if [ "$signed" = true ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            export_secret APPLE_ID "$APPLE_ID"
            export_secret APPLE_PASSWORD "$APPLE_PASSWORD"
            export_secret APPLE_TEAM_ID "$APPLE_TEAM_ID"
            notarized=true
          fi

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            export_secret TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              export_secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            fi
            updater=true
          fi

          {
            echo "signed=$signed"
            echo "notarized=$notarized"
            echo "updater=$updater"
          } >> "$GITHUB_OUTPUT"

          echo "code signing: $signed | notarization: $notarized | updater artifacts: $updater"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # C++17 std::filesystem in the bundled model's ggml — see the Windows
          # job below for the full story.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # APPLE_* and TAURI_SIGNING_* deliberately do NOT appear here — the
          # step above exported the ones that exist, and a step-level `env:`
          # would shadow them back to empty. See its comment for why empty is
          # worse than unset.
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "myco ${{ github.ref_name }}"
          # Always a draft: verify the artifacts (scripts/verify-macos-release.sh)
          # before anyone can download them.
          releaseDraft: true
          prerelease: false
          releaseBody: ${{ steps.signing.outputs.notarized == 'true' && 'DRAFT — the .dmg was signed and notarized on CI. Verify it with scripts/verify-macos-release.sh, then publish. latest.json and the .app.tar.gz/.sig pair are the updater channel; leave them.' || 'DRAFT — the .dmg built here is UNSIGNED (no Apple secrets in this repo). Replace it with a locally signed and notarized one (docs/SIGNING.md Part 1b), then publish. latest.json and the .app.tar.gz/.sig pair are the updater channel; leave them.' }}
          # `app` is required, not cosmetic: the bundler only emits the macOS
          # updater artifact when the plain .app bundle is one of the built
          # targets — a dmg-only build silently produces no .app.tar.gz. The
          # inline --config turns updater artifacts on for CI only, so a local
          # `tauri build` still needs no signing key — and it is dropped entirely
          # without the updater key, because signing the artifacts is not
          # optional once they exist.
          args: ${{ steps.signing.outputs.updater == 'true' && '--bundles app,dmg --config {"bundle":{"createUpdaterArtifacts":true}}' || '--bundles app,dmg' }}
          # includeUpdaterJson defaults to true; latest.json is meaningless
          # without the signed artifacts it points at.
          includeUpdaterJson: ${{ steps.signing.outputs.updater }}

  publish-tauri:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # tauri-action creates the release + uploads assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest" # NSIS .exe installer
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Build the tagged tree, not whatever main is at dispatch time.
          ref: ${{ inputs.tag }}
          # The bundled SEED model (models/*.gguf, ~412 MB) is stored in Git
          # LFS. Without this the runner checks out only the ~130-byte LFS
          # pointer, and tauri bundles THAT — producing a ~10 MB installer whose
          # offline model is a text stub. Pull the real object so the shipped
          # app's builtin model actually works.
          lfs: true

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      # Host target only — the Apple targets went with the macOS job.
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08

      - name: install frontend dependencies
        run: npm ci
        working-directory: app

      # Pinned by commit SHA: this job holds the Apple cert and the updater
        # private key, and a tag (or a branch like @stable) can be moved by
        # anyone who can push to that repo. The trailing comment is the human
        # -readable version the SHA corresponds to..
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The bundled SEED model (llama-cpp-sys-2 → ggml) compiles C++17
          # std::filesystem, which is "unavailable before macOS 10.15". Tauri's
          # default deployment target (10.13) made the universal-darwin build
          # fail to compile. Pin 10.15 so the C++ has std::filesystem; matches
          # bundle.macOS.minimumSystemVersion. Inert in this Windows job; the
          # macos-updater job above is where it does the work.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # Windows signing is OFF: no code-signing certificate exists yet, so
          # the .exe ships unsigned (see the release body + the README
          # SmartScreen note). No AZURE_* vars are passed for the same
          # empty-string reason the macOS job explains at length — to enable
          # Windows signing, add a gate step like that one and the
          # bundle.windows config from docs/SIGNING.md Part 2.
        with:
          projectPath: app # the Tauri app lives in app/, not the repo root
          tagName: ${{ inputs.tag }}
          releaseName: "myco ${{ inputs.tag }}"
          releaseBody: >
            myco — a cross-platform desktop wiki for plain markdown vaults.

            Download the installer for your OS below.
            macOS: signed and notarized .dmg (Apple Silicon), uploaded separately.
            Windows: NSIS .exe installer, UNSIGNED — SmartScreen will warn on
            first launch; see the README for how to allow it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
