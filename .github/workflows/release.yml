name: release

# Build the WINDOWS installer on a real runner and attach it to an existing
# GitHub Release. NSIS .exe, one of the two bundle targets in tauri.conf.json.
#
# WINDOWS ONLY, MANUAL ONLY, as of v0.3.0 — both on purpose:
#
# - macOS is built and signed locally (docs/SIGNING.md Part 1b). The Developer
#   ID certificate lives in the maintainer's keychain, not in repo secrets, so a
#   runner CANNOT produce a signed .dmg. Leaving the macOS job in this matrix
#   would upload an UNSIGNED .dmg over the signed one — strictly worse than no
#   macOS job at all.
# - Firing on `push: tags` would race that same unsigned build against the local
#   upload, so this is dispatch-only. Publish the release first (with the signed
#   .dmg), then dispatch this to add the Windows installer to it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and attach assets to (e.g. v0.3.0)"
        required: true

jobs:
  publish-tauri:
    permissions:
      contents: write # tauri-action creates the release + uploads assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest" # NSIS .exe installer
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tagged tree, not whatever main is at dispatch time.
          ref: ${{ inputs.tag }}
          # The bundled SEED model (models/*.gguf, ~412 MB) is stored in Git
          # LFS. Without this the runner checks out only the ~130-byte LFS
          # pointer, and tauri bundles THAT — producing a ~10 MB installer whose
          # offline model is a text stub. Pull the real object so the shipped
          # app's builtin model actually works.
          lfs: true

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Host target only — the Apple targets went with the macOS job.
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci
        working-directory: app

      # Pinned to an exact release of tauri-action (no moving v0/v1 tag exists).
      - uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The bundled SEED model (llama-cpp-sys-2 → ggml) compiles C++17
          # std::filesystem, which is "unavailable before macOS 10.15". Tauri's
          # default deployment target (10.13) made the universal-darwin build
          # fail to compile. Pin 10.15 so the C++ has std::filesystem; matches
          # bundle.macOS.minimumSystemVersion. Inert here (Windows-only job),
          # kept so a macOS job restored later does not regress.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # Code signing is OFF for v0.1 (unsigned .dmg / .exe — see the release
          # body + README Gatekeeper/SmartScreen note). The APPLE_* signing env
          # vars are deliberately NOT passed: an unset secret resolves to an
          # EMPTY string, and tauri-action treats a present-but-empty
          # APPLE_CERTIFICATE as "sign" and runs `security import` with no data,
          # which fails the whole macOS bundle. To enable signing later, add the
          # secrets and restore the APPLE_* / AZURE_* env block per docs/SIGNING.md.
        with:
          projectPath: app # the Tauri app lives in app/, not the repo root
          tagName: ${{ inputs.tag }}
          releaseName: "myco ${{ inputs.tag }}"
          releaseBody: >
            myco — a cross-platform desktop wiki for plain markdown vaults.

            Download the installer for your OS below.
            macOS: signed and notarized .dmg (Apple Silicon), uploaded separately.
            Windows: NSIS .exe installer, UNSIGNED — SmartScreen will warn on
            first launch; see the README for how to allow it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
